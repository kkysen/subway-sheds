repos:
  - repo: local
    hooks:
      # Run every tool with `uv` in the project's locked environment,
      # so the versions come from `uv.lock` rather than being pinned here, too.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude --check
        language: system
        types_or: [python, pyi, jupyter]
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: pyrefly
        name: pyrefly
        entry: uv run pyrefly check
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
      - id: web
        name: web (tsrs, biome)
        entry: npm --prefix web run check
        language: system
        files: ^web/
        pass_filenames: false
      - id: route
        name: route (rustfmt, clippy, tests)
        entry: bash -c 'cd route && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test'
        language: system
        files: ^route/
        pass_filenames: false
      # Built for WebAssembly, so its `cargo test` can't run here, and it has no tests.
      - id: web-times
        name: web/times (rustfmt, clippy)
        entry: bash -c 'cd web/times && cargo fmt --check && cargo clippy --all-targets -- -D warnings'
        language: system
        files: ^web/times/
        pass_filenames: false
