<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Subway Sheds</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="map"></div>
    <form id="controls">
      <details open>
        <summary><h1>Subway sheds with QueensLink</h1></summary>
        <p>From <strong id="station-name">…</strong> <span id="day-name">in the weekday morning peak</span>.
          Click a station to change it; orange ones are new with QueensLink.</p>
        <fieldset>
          <legend>When</legend>
          <label><input type="radio" name="day" value="weekday" checked /> Weekday, 7:30 to 8:30</label>
          <label><input type="radio" name="day" value="saturday" /> Saturday, 11 to noon</label>
        </fieldset>
        <fieldset>
          <legend>Show</legend>
          <label><input type="radio" name="view" value="baseline" /> Minutes without QueensLink</label>
          <label><input type="radio" name="view" value="queenslink" checked /> Minutes with QueensLink</label>
          <label><input type="radio" name="view" value="saved" /> Minutes saved by QueensLink</label>
        </fieldset>
        <div id="legend"></div>
      </details>
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
