<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Subway Sheds</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="map"></div>
    <form id="controls">
      <details open>
        <summary>
          <h1>Subway sheds with QueensLink</h1>
          <span id="summary-status"></span>
        </summary>
        <div class="section">
          <p>From <strong id="station-name">…</strong> <span id="day-name">around 8 am on a weekday</span>.
            Click a station to change it.</p>
        </div>
        <fieldset class="section">
          <legend>Time</legend>
          <label title="The median trip, leaving every minute from 7:30 to 8:30 am"><input type="radio" name="day" value="weekday" checked /> Weekday @ 8 am</label>
          <label title="The median trip, leaving every minute from 11:30 am to 12:30 pm"><input type="radio" name="day" value="saturday" /> Saturday @ 12 pm</label>
        </fieldset>
        <fieldset class="section">
          <legend>Show</legend>
          <label><input type="radio" name="view" value="baseline" /> Minutes without QueensLink</label>
          <label><input type="radio" name="view" value="queenslink" checked /> Minutes with QueensLink</label>
          <label><input type="radio" name="view" value="saved" /> Minutes saved by QueensLink</label>
        </fieldset>
        <div class="section station-key">
          <p><span class="legend-station"></span> Existing subway station</p>
          <p><span class="legend-station legend-station-new"></span> New QueensLink station</p>
        </div>
        <div class="section" id="legend"></div>
        <a id="full-map" href="./" target="_blank" hidden>Open in a new tab ↗</a>
      </details>
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
