name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Java, `ant`, Node, and `uv`, as `mise.toml` pins them.
      - uses: jdx/mise-action@v5.2.2

      # `uv`'s cache, mostly for `jpype1`, which is built from source for Python 3.15.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: ruff format
        run: uv run ruff format --check

      - name: ruff check
        run: uv run ruff check

      - name: ty
        run: uv run ty check

      - name: pyrefly
        run: uv run pyrefly check

      - name: pytest
        run: uv run pytest

      - name: web
        working-directory: web
        run: |
          npm ci
          npm run check

  # Route every station in both scenarios and publish the page.
  pages:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v5.2.2

      # `uv`'s cache, mostly for `jpype1`, which is built from source for Python 3.15.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # The downloads, so a flaky server (BBBike's has timed out from here) only has to answer once,
      # and so the streets don't change under the travel times whenever BBBike updates its extract.
      # Bump the version to download them again.
      - uses: actions/cache@v6.1.0
        with:
          path: |
            .cache/mdb
            .cache/nyc.osm.pbf
            .cache/nyc-shoreline.json
          key: downloads-v1

      - name: fetch
        run: uv run subway-sheds fetch

      # Routing takes a while, and only what goes into it changes its output.
      - uses: actions/cache@v6.1.0
        id: travel-times
        with:
          path: .cache/travel_times
          # With the downloads' version, since they go into it too.
          key: travel-times-downloads-v1-${{ hashFiles('gtfs/**', 'src/**', 'uv.lock') }}

      - name: route
        if: steps.travel-times.outputs.cache-hit != 'true'
        run: uv run subway-sheds route

      - name: export
        run: uv run subway-sheds export

      - name: build
        working-directory: web
        run: |
          npm ci
          npm run build -- --base=/${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v6.0.0

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web/dist

      - uses: actions/deploy-pages@v5.0.1
        id: deploy
