name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels a run still going for an older one,
# whose routing and deploy it would only redo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # `uv` from `setup-uv` rather than `mise.toml`, since it also caches `uv`'s downloads
      # and builds between runs.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      # Node, as `mise.toml` pins it, but not `uv`, which `setup-uv` installed.
      - uses: jdx/mise-action@v5.2.3
        env:
          MISE_DISABLE_TOOLS: uv

      # The `route` crate's dependencies and build, which `uv` compiles through `maturin`,
      # in every job that runs `uv`, as the runner's Rust has it.
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            route/target
          key: cargo-${{ runner.os }}-${{ hashFiles('route/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: ruff format
        run: uv run ruff format --check

      - name: ruff check
        run: uv run ruff check

      - name: ty
        run: uv run ty check

      - name: pyrefly
        run: uv run pyrefly check

      - name: pytest
        run: uv run pytest

      - name: web
        working-directory: web
        run: |
          npm ci
          npm run check

  # Fetch what routing needs, once for every job after it, and see whether it's routed already.
  prepare:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.inputs.outputs.key }}
      routed: ${{ steps.routed.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - uses: jdx/mise-action@v5.2.3
        env:
          MISE_DISABLE_TOOLS: uv

      # The `route` crate's dependencies and build, which `uv` compiles through `maturin`,
      # in every job that runs `uv`, as the runner's Rust has it.
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            route/target
          key: cargo-${{ runner.os }}-${{ hashFiles('route/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # The MTA feed and shoreline, which never change.
      - uses: actions/cache@v6.1.0
        with:
          path: |
            .cache/mdb
            .cache/nyc-shoreline.json
          key: downloads-v1

      # The streets filtered from Geofabrik's New York State extract, the newest cached,
      # which `fetch` sees whether Geofabrik has newer OSM data than (daily at most),
      # and only then downloads the 500 MB extract to replace them.
      # They're saved by the version they were filtered from, which only `fetch` asks Geofabrik:
      # its servers sometimes take minutes to answer even that, more from CI than elsewhere.
      - uses: actions/cache/restore@v6.1.0
        id: streets
        with:
          path: |
            .cache/nyc-streets.osm.pbf
            .cache/nyc-streets.source-state.txt
          # Never saved under, so that the newest of the `restore-keys` is restored.
          key: streets-newest
          restore-keys: streets-

      - name: fetch
        run: uv run subway-sheds fetch

      - uses: actions/cache/save@v6.1.0
        if: >-
          steps.streets.outputs.cache-matched-key
          != format('streets-{0}', hashFiles('.cache/nyc-streets.source-state.txt'))
        with:
          path: |
            .cache/nyc-streets.osm.pbf
            .cache/nyc-streets.source-state.txt
          key: streets-${{ hashFiles('.cache/nyc-streets.source-state.txt') }}

      # Everything tracked that goes into routing: the QueensLink feed, the code, and the versions it runs on
      # (Python, its packages, and the Rust crates, `mta-od-data`'s by the commit pinned),
      # each by its blob in git,
      # so that nothing written during the run, like `src/`'s `__pycache__/`, can change it.
      # The downloads' URLs are in the code, so they're covered too.
      # With the streets, which aren't tracked, since `fetch` keeps them up to date with OSM.
      - name: travel times' inputs
        id: inputs
        run: |
          tracked=$(git ls-files -s -- gtfs src route pyproject.toml uv.lock .python-version mise.toml | sha256sum | cut -d' ' -f1)
          streets=$(sha256sum .cache/nyc-streets.osm.pbf | cut -d' ' -f1)
          echo "key=travel-times-$tracked-$streets" >> "$GITHUB_OUTPUT"

      # Routing takes a while, and only what goes into it changes its output.
      # The export too, whose inputs are among routing's: the travel times, grid, and feeds.
      # Only looked up here; `pages` restores it.
      - uses: actions/cache/restore@v6.1.0
        id: routed
        with:
          path: |
            .cache/travel_times
            web/public/data
          key: ${{ steps.inputs.outputs.key }}
          lookup-only: true

      # The same inputs for every job, even if Geofabrik has newer streets by the time one starts.
      - uses: actions/upload-artifact@v7.0.2
        if: steps.routed.outputs.cache-hit != 'true'
        with:
          name: inputs
          path: |
            .cache/gtfs
            .cache/nyc-streets.osm.pbf
            .cache/nyc-shoreline.json
          include-hidden-files: true
          retention-days: 1

  # Each scenario on each day in a job of its own, at once rather than one after another.
  route:
    needs: prepare
    if: needs.prepare.outputs.routed != 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scenario: [baseline, queenslink]
        day: [weekday, saturday]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - uses: jdx/mise-action@v5.2.3
        env:
          MISE_DISABLE_TOOLS: uv

      # The `route` crate's dependencies and build, which `uv` compiles through `maturin`,
      # in every job that runs `uv`, as the runner's Rust has it.
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            route/target
          key: cargo-${{ runner.os }}-${{ hashFiles('route/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - uses: actions/download-artifact@v8.0.2
        with:
          name: inputs
          path: .cache

      - name: route
        run: uv run subway-sheds route --scenario ${{ matrix.scenario }} --day ${{ matrix.day }}

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: travel-times-${{ matrix.scenario }}-${{ matrix.day }}
          path: |
            .cache/travel_times/${{ matrix.scenario }}-${{ matrix.day }}.parquet
            .cache/travel_times/${{ matrix.scenario }}-${{ matrix.day }}-stations.parquet
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Export the travel times, whether just routed or cached, and publish the page.
  pages:
    needs: [prepare, route]
    # Also when `route` was skipped, since everything was routed already.
    if: >-
      !cancelled() && needs.prepare.result == 'success'
      && (needs.route.result == 'success' || needs.route.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - uses: jdx/mise-action@v5.2.3
        env:
          MISE_DISABLE_TOOLS: uv

      # The `route` crate's dependencies and build, which `uv` compiles through `maturin`,
      # in every job that runs `uv`, as the runner's Rust has it.
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            route/target
          key: cargo-${{ runner.os }}-${{ hashFiles('route/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - uses: actions/cache/restore@v6.1.0
        if: needs.prepare.outputs.routed == 'true'
        with:
          path: |
            .cache/travel_times
            web/public/data
          key: ${{ needs.prepare.outputs.key }}
          fail-on-cache-miss: true

      - uses: actions/download-artifact@v8.0.2
        if: needs.prepare.outputs.routed != 'true'
        with:
          name: inputs
          path: .cache

      - uses: actions/download-artifact@v8.0.2
        if: needs.prepare.outputs.routed != 'true'
        with:
          pattern: travel-times-*
          path: .cache/travel_times
          merge-multiple: true

      - name: export
        if: needs.prepare.outputs.routed != 'true'
        run: uv run subway-sheds export

      - uses: actions/cache/save@v6.1.0
        if: needs.prepare.outputs.routed != 'true'
        with:
          path: |
            .cache/travel_times
            web/public/data
          key: ${{ needs.prepare.outputs.key }}

      - name: build
        working-directory: web
        run: |
          npm ci
          npm run build -- --base=/${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v6.0.0

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web/dist

      - uses: actions/deploy-pages@v5.0.1
        id: deploy
