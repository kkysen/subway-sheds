name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # `uv` from `setup-uv` rather than `mise.toml`, since it also caches `uv`'s downloads
      # and builds between runs, mostly `jpype1`, which is built from source for Python 3.15.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      # Java, `ant`, and Node, as `mise.toml` pins them, but not `uv`, which `setup-uv` installed.
      - uses: jdx/mise-action@v5.2.3
        env:
          MISE_DISABLE_TOOLS: uv

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: ruff format
        run: uv run ruff format --check

      - name: ruff check
        run: uv run ruff check

      - name: ty
        run: uv run ty check

      - name: pyrefly
        run: uv run pyrefly check

      - name: pytest
        run: uv run pytest

      - name: web
        working-directory: web
        run: |
          npm ci
          npm run check

  # Route every station in both scenarios and publish the page.
  pages:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - uses: jdx/mise-action@v5.2.3
        env:
          MISE_DISABLE_TOOLS: uv

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # The MTA feed and shoreline, which never change.
      - uses: actions/cache@v6.1.0
        with:
          path: |
            .cache/mdb
            .cache/nyc-shoreline.json
          key: downloads-v1

      # The streets filtered from Geofabrik's New York State extract, the newest cached,
      # which `fetch` sees whether Geofabrik has newer OSM data than (daily at most),
      # and only then downloads the 500 MB extract to replace them.
      # They're saved by the version they were filtered from, which only `fetch` asks Geofabrik:
      # its servers sometimes take minutes to answer even that, more from CI than elsewhere.
      - uses: actions/cache/restore@v6.1.0
        id: streets
        with:
          path: |
            .cache/nyc-streets.osm.pbf
            .cache/nyc-streets.source-state.txt
          # Never saved under, so that the newest of the `restore-keys` is restored.
          key: streets-newest
          restore-keys: streets-

      - name: fetch
        run: uv run subway-sheds fetch

      - uses: actions/cache/save@v6.1.0
        if: >-
          steps.streets.outputs.cache-matched-key
          != format('streets-{0}', hashFiles('.cache/nyc-streets.source-state.txt'))
        with:
          path: |
            .cache/nyc-streets.osm.pbf
            .cache/nyc-streets.source-state.txt
          key: streets-${{ hashFiles('.cache/nyc-streets.source-state.txt') }}

      # Routing takes a while, and only what goes into it changes its output.
      - uses: actions/cache@v6.1.0
        id: travel-times
        with:
          path: .cache/travel_times
          # With the downloads' version and the streets, since they go into it too.
          key: >-
            travel-times-downloads-v1-${{
            hashFiles('gtfs/**', 'src/**', 'uv.lock', '.cache/nyc-streets.osm.pbf') }}

      - name: route
        if: steps.travel-times.outputs.cache-hit != 'true'
        run: uv run subway-sheds route

      - name: export
        run: uv run subway-sheds export

      - name: build
        working-directory: web
        run: |
          npm ci
          npm run build -- --base=/${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v6.0.0

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web/dist

      - uses: actions/deploy-pages@v5.0.1
        id: deploy
