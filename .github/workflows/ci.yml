name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels a run still going for an older one,
# whose routing and deploy it would only redo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # `uv` from `setup-uv` rather than `mise.toml`, since it also caches `uv`'s downloads
      # and builds between runs.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          # With the `route` crate, whose wheel `uv sync` builds and the cache keeps,
          # as `tool.uv.cache-keys` has `uv` rebuild it.
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            route/Cargo.lock
            route/Cargo.toml
            route/src/**/*.rs
            web/times/Cargo.toml
            web/times/src/**/*.rs

      # Node, as `mise.toml` pins it, but not `uv`, which `setup-uv` installed.
      # OR-Tools' C++ library, which the `route` crate links against,
      # restored before `mise install` would download it (see `scripts/fetch-ortools.sh`),
      # and kept with the `route` crate's build, which records where it is.
      - uses: actions/cache@v6.1.0
        with:
          path: .cache/ortools
          key: ortools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'scripts/fetch-ortools.sh') }}

      - uses: jdx/mise-action@v5.2.3
        env:
          MISE_DISABLE_TOOLS: uv

      # In case `mise install` had nothing to install, and so didn't run it.
      - name: OR-Tools
        run: scripts/fetch-ortools.sh

      # The `route` crate's dependencies and build, which `uv` compiles through `maturin`,
      # in every job that runs `uv`, as the runner's Rust has it.
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            route/target
            web/times/target
          key: cargo-${{ runner.os }}-${{ hashFiles('route/Cargo.lock', 'web/times/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # On its own, so that building the `route` crate isn't timed as the first step that runs `uv`,
      # and failing if `uv.lock` is out of date, which `uv run` would quietly update.
      - name: uv sync
        run: uv sync --locked

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: ruff format
        run: uv run ruff format --check

      - name: ruff check
        run: uv run ruff check

      - name: ty
        run: uv run ty check

      - name: pyrefly
        run: uv run pyrefly check

      - name: pytest
        run: uv run pytest

      - name: web
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run check

      # The `route` crate's own tests and lints, which `maturin` building it for `uv` doesn't run.
      - name: route
        working-directory: route
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # The page's travel times in WebAssembly, which `bun run build` builds.
      - name: web/times
        working-directory: web/times
        run: |
          rustup target add wasm32-unknown-unknown
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          # On the runner's own target, as it builds for WebAssembly, which can't run here.
          cargo test --target "$(rustc -vV | sed -n 's/host: //p')"

  # The page's data: fetch what routing needs, make the scenarios' feeds, walk the streets,
  # then route and export,
  # unless what goes into them is unchanged, and the data's cached.
  # In one job, as each job takes most of a minute to set up,
  # and only the data goes on to `pages`.
  # Every scenario on every day routed together, as that walks the streets once.
  data:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          # With the `route` crate, whose wheel `uv sync` builds and the cache keeps,
          # as `tool.uv.cache-keys` has `uv` rebuild it.
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            route/Cargo.lock
            route/Cargo.toml
            route/src/**/*.rs
            web/times/Cargo.toml
            web/times/src/**/*.rs

      # OR-Tools' C++ library, which the `route` crate links against,
      # restored before `mise install` would download it (see `scripts/fetch-ortools.sh`),
      # and kept with the `route` crate's build, which records where it is.
      - uses: actions/cache@v6.1.0
        with:
          path: .cache/ortools
          key: ortools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'scripts/fetch-ortools.sh') }}

      - uses: jdx/mise-action@v5.2.3
        env:
          MISE_DISABLE_TOOLS: uv

      # In case `mise install` had nothing to install, and so didn't run it.
      - name: OR-Tools
        run: scripts/fetch-ortools.sh

      # The `route` crate's dependencies and build, which `uv` compiles through `maturin`,
      # in every job that runs `uv`, as the runner's Rust has it.
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            route/target
            web/times/target
          key: cargo-${{ runner.os }}-${{ hashFiles('route/Cargo.lock', 'web/times/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # On its own, so that building the `route` crate isn't timed as the first step that runs `uv`,
      # and failing if `uv.lock` is out of date, which `uv run` would quietly update.
      - name: uv sync
        run: uv sync --locked

      # The MTA feeds and shoreline, which never change but for their pins in `sources.py`,
      # and the 2019 feed from the Wayback Machine, which can be slow or limit downloads.
      # A changed pin restores the downloads from before, so that `fetch` only downloads
      # what it doesn't have, not the Wayback Machine's again.
      - uses: actions/cache@v6.1.0
        with:
          path: |
            .cache/mdb
            .cache/wayback
            .cache/nyc-shoreline.json
          key: downloads-${{ hashFiles('src/subway_sheds/sources.py') }}
          restore-keys: downloads-

      # The streets filtered from Geofabrik's New York State extract, the newest cached,
      # which `fetch` sees whether Geofabrik has newer OSM data than, daily at most,
      # and only then downloads the 500 MB extract to replace them.
      # They're saved by the version they were filtered from, which only `fetch` asks Geofabrik,
      # and when it last asked, so that later runs that day don't ask again:
      # its servers sometimes take minutes to answer even that, more from CI than elsewhere.
      - uses: actions/cache/restore@v6.1.0
        id: streets
        with:
          path: |
            .cache/nyc-streets.osm.pbf
            .cache/nyc-streets.source-state.txt
            .cache/nyc-streets.checked.txt
          # Never saved under, so that the newest of the `restore-keys` is restored.
          key: streets-newest
          restore-keys: streets-

      - name: fetch
        run: uv run subway-sheds fetch

      - uses: actions/cache/save@v6.1.0
        if: >-
          steps.streets.outputs.cache-matched-key
          != format('streets-{0}', hashFiles('.cache/nyc-streets.source-state.txt', '.cache/nyc-streets.checked.txt'))
        with:
          path: |
            .cache/nyc-streets.osm.pbf
            .cache/nyc-streets.source-state.txt
            .cache/nyc-streets.checked.txt
          key: streets-${{ hashFiles('.cache/nyc-streets.source-state.txt', '.cache/nyc-streets.checked.txt') }}

      # Everything tracked that goes into routing: the QueensLink feed, stations' entrances, the code
      # (with `web/times/`, which export finds the walks out the page takes with), and the versions it runs on
      # (Python, its packages, and the Rust crates, `mta-od-data`'s by the commit pinned),
      # each by its blob in git,
      # so that nothing written during the run, like `src/`'s `__pycache__/`, can change it.
      # The downloads' URLs are in the code, so they're covered too.
      # With the streets, which aren't tracked, since `fetch` keeps them up to date with OSM.
      - name: data's inputs
        id: inputs
        run: |
          tracked=$(git ls-files -s -- data src route web/times pyproject.toml uv.lock .python-version mise.toml | sha256sum | cut -d' ' -f1)
          streets=$(sha256sum .cache/nyc-streets.osm.pbf | cut -d' ' -f1)
          echo "key=data-$tracked-$streets" >> "$GITHUB_OUTPUT"

      # Routing and exporting take a while, and only what goes into them changes their output.
      - uses: actions/cache/restore@v6.1.0
        id: data
        with:
          path: web/public/data
          key: ${{ steps.inputs.outputs.key }}

      - name: scenarios
        if: steps.data.outputs.cache-hit != 'true'
        run: uv run subway-sheds scenarios

      - name: walks
        if: steps.data.outputs.cache-hit != 'true'
        run: uv run subway-sheds walks

      - name: route
        if: steps.data.outputs.cache-hit != 'true'
        run: uv run subway-sheds route

      - name: export
        if: steps.data.outputs.cache-hit != 'true'
        run: uv run subway-sheds export

      - uses: actions/cache/save@v6.1.0
        if: steps.data.outputs.cache-hit != 'true'
        with:
          path: web/public/data
          key: ${{ steps.inputs.outputs.key }}

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: data
          path: web/public/data
          if-no-files-found: error
          retention-days: 1

  # Build the page with its data and publish it.
  pages:
    needs: data
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1

      # Node, as `mise.toml` pins it, but not `uv`, which building the page doesn't need.
      - uses: jdx/mise-action@v5.2.3
        env:
          MISE_DISABLE_TOOLS: uv

      # `web/times/`'s build, which `bun run build` compiles to WebAssembly.
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            web/times/target
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('web/times/Cargo.lock') }}
          restore-keys: cargo-wasm-${{ runner.os }}-

      # QueensLink's icons, which `bun run build` downloads from queenslink.org if they're not here.
      - uses: actions/cache@v6.1.0
        with:
          path: .cache/queenslink-icons
          key: queenslink-icons-${{ hashFiles('scripts/fetch-icons.sh') }}

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - uses: actions/download-artifact@v8.0.2
        with:
          name: data
          path: web/public/data

      - name: build
        working-directory: web
        run: |
          rustup target add wasm32-unknown-unknown
          bun install --frozen-lockfile
          bun run build --base=/${{ github.event.repository.name }}/

      # Before publishing it, the page as built, in headless Chromium, with Times Sq selected
      # (see `scripts/e2e_browser.py`),
      # with Playwright as `uv.lock` pins it, without the project, which this job doesn't build.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: browser
        run: |
          playwright="uv run --no-project --with playwright==$(sed -n '/^name = "playwright"$/{n;s/^version = "\(.*\)"$/\1/p}' uv.lock)"
          $playwright playwright install --with-deps chromium
          $playwright python scripts/e2e_browser.py 127 /${{ github.event.repository.name }}/

      # The basemap as OpenFreeMap serves it now, which the screenshots are drawn over:
      # its style, from `web/src/main.ts`, and each of its sources' TileJSON,
      # which names the tiles' build, as `planet/20261115_080022_pt/`, so a new build changes it.
      - name: basemap
        id: basemap
        run: |
          style=$(grep -oE 'https://tiles\.openfreemap\.org/styles/[^"]+' web/src/main.ts)
          test "$(echo "$style" | wc -l)" -eq 1
          curl -fsS "$style" > "$RUNNER_TEMP/style.json"
          {
            cat "$RUNNER_TEMP/style.json"
            jq -r '.sources[].url // empty' "$RUNNER_TEMP/style.json" | xargs -r -n 1 curl -fsS
          } | sha256sum | cut -d ' ' -f 1 | sed 's/^/hash=/' >> "$GITHUB_OUTPUT"

      # The screenshots, reused from the last run when nothing they're taken of changed:
      # the page as built, which has its data and QueensLink's icons in it,
      # the basemap under it,
      # and the script and the Playwright, Chromium, and Pillow it runs on, which `uv.lock` pins.
      # The built page, rather than `web/` and the data, as the icons aren't tracked,
      # and the build comes out the same each time.
      - uses: actions/cache@v6.1.0
        id: screenshots
        with:
          path: |
            web/dist/screenshots
            web/dist/queenslink/screenshots
          key: screenshots-${{ steps.basemap.outputs.hash }}-${{ hashFiles('web/dist/**', 'scripts/screenshots.py', 'uv.lock') }}

      # Each station's views for each map page, drawn at 3× pixel density,
      # and scaled down to 2× and 1× with Pillow, as `uv.lock` pins it,
      # each saved as AVIF, which Pillow's wheels can write (the script checks before drawing).
      - name: screenshots
        if: steps.screenshots.outputs.cache-hit != 'true'
        run: |
          playwright="uv run --no-project --with playwright==$(sed -n '/^name = "playwright"$/{n;s/^version = "\(.*\)"$/\1/p}' uv.lock)"
          pillow="--with pillow==$(sed -n '/^name = "pillow"$/{n;s/^version = "\(.*\)"$/\1/p}' uv.lock)"
          $playwright $pillow python scripts/screenshots.py /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v6.0.0

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web/dist

      - uses: actions/deploy-pages@v5.0.1
        id: deploy
