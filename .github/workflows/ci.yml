name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Java, `ant`, Node, and `uv`, as `mise.toml` pins them.
      - uses: jdx/mise-action@v5.2.2

      - name: ruff format
        run: uv run ruff format --check

      - name: ruff check
        run: uv run ruff check

      - name: ty
        run: uv run ty check

      - name: pyrefly
        run: uv run pyrefly check

      - name: pytest
        run: uv run pytest

      - name: web
        working-directory: web
        run: |
          npm ci
          npm run check

  # Route every station in both scenarios and publish the page.
  pages:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v5.2.2

      - name: fetch
        run: uv run subway-sheds fetch

      # Routing takes a while, and only what goes into it changes its output.
      - uses: actions/cache@v6.1.0
        id: travel-times
        with:
          path: .cache/travel_times
          key: travel-times-${{ hashFiles('gtfs/**', 'src/**', 'uv.lock') }}

      - name: route
        if: steps.travel-times.outputs.cache-hit != 'true'
        run: uv run subway-sheds route

      - name: export
        run: uv run subway-sheds export

      - name: build
        working-directory: web
        run: |
          npm ci
          npm run build -- --base=/${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v6.0.0

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web/dist

      - uses: actions/deploy-pages@v5.0.1
        id: deploy
